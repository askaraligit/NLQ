name: nlq

x-database-task: &database-task
  profiles: [database]
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: development
  init: true
  depends_on:
    postgres:
      condition: service_healthy

services:
  db-configure:
    <<: *database-task
    depends_on: []
    volumes:
      - .:/workspace
    command: ["python", "-m", "app.db.configure", "--root", "/workspace"]

  db-bootstrap:
    <<: *database-task
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nlq}
      POSTGRES_USER: ${POSTGRES_USER:-nlq_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      NLQ_APP_PASSWORD: ${NLQ_APP_PASSWORD:-}
      NLQ_READER_PASSWORD: ${NLQ_READER_PASSWORD:-}
      NLQ_MIGRATOR_PASSWORD: ${NLQ_MIGRATOR_PASSWORD:-}
    command: ["python", "-m", "app.db.bootstrap"]

  migrate:
    <<: *database-task
    env_file:
      - path: apps/api/migrations/.env
        required: false
    environment:
      MIGRATION_DATABASE_HOST: postgres
      MIGRATION_DATABASE_PORT: "5432"
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]

  seed:
    <<: *database-task
    env_file:
      - path: apps/api/migrations/.env
        required: false
    environment:
      MIGRATION_DATABASE_HOST: postgres
      MIGRATION_DATABASE_PORT: "5432"
    command: ["uv", "run", "--frozen", "python", "-m", "seeds"]

  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nlq}
      POSTGRES_USER: ${POSTGRES_USER:-nlq_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 or set a local PostgreSQL password in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores its versioned data directory beneath this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    init: true
    env_file:
      - apps/api/.env
    environment:
      APP_ENV: development
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      ANALYTICS_DATABASE_HOST: postgres
      ANALYTICS_DATABASE_PORT: "5432"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    init: true
    env_file:
      - apps/web/.env.local
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
      - web_next:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  web_node_modules:
  web_next:
