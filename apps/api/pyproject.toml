[project]
name = "nlq-api"
version = "0.1.0"
description = "FastAPI foundation for the NLQ application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "sqlglot>=28.0,<29.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: requires explicit credentials for an isolated PostgreSQL test database"]
